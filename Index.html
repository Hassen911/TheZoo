<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mia Playlist</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .player-container { background: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        audio { width: 100%; margin: 20px 0; }
        .playlist { list-style: none; padding: 0; text-align: left; }
        .playlist li { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .playlist li:hover { background: #282828; color: #1db954; }
        .active { color: #1db954; font-weight: bold; }
    </style>
</head>
<body>

    <h1>I Miei Brani</h1>
    
    <div class="player-container">
        <h3 id="track-title">Seleziona una canzone</h3>
        <!-- Il player audio nativo di HTML5 -->
        <audio id="audio-player" controls></audio>
        
        <ul class="playlist">
            <!-- Sostituisci 'canzone1.mp3' con i nomi reali dei tuoi file -->
            <li onclick="playSong('audio/canzone1.mp3', 'Nome Canzone 1', this)">🎵 Nome Canzone 1</li>
            <li onclick="playSong('audio/canzone2.mp3', 'Nome Canzone 2', this)">🎵 Nome Canzone 2</li>
            <li onclick="playSong('audio/canzone3.mp3', 'Nome Canzone 3', this)">🎵 Nome Canzone 3</li>
        </ul>
    </div>

    <script>
        function playSong(audioSrc, title, element) {
            const player = document.getElementById('audio-player');
            const titleDisplay = document.getElementById('track-title');
            
            // Imposta la sorgente audio e il titolo
            player.src = audioSrc;
            titleDisplay.innerText = title;
            
            // Rimuove la classe 'active' dagli altri elementi e la assegna a quello cliccato
            document.querySelectorAll('.playlist li').forEach(li => li.classList.remove('active'));
            element.classList.add('active');
            
            // Avvia la riproduzione
            player.play();
        }
    </script>

</body>
</html>
